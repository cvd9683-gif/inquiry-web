          id: `q2`, text: `Which design tricks make AI feel trustworthy, or keep us coming back?`,
          sources: [
            { type: `paper`, title: `Dark Patterns at Scale: Findings from a Crawl of 11K Shopping Websites`, authors: `Mathur et al.`, year: `2019`, venue: `CSCW / PACM HCI`, url: `https://doi.org/10.1145/3359183`,
              takeaway: `Manipulative design tricks showed up on about 1 in 10 shopping sites they crawled.`,
              why: `Gives me names for tricks I might start spotting in AI products.`,
              surprised: `Manipulative design was common enough to show up on about 1 in 10 shopping sites.`,
              quote: `` },
            { type: `paper`, title: `Sycophancy in GPT-4o: What happened and what we're doing about it`, authors: `OpenAI`, year: `2025`, venue: `Company post-mortem`, url: `https://openai.com/index/sycophancy-in-gpt-4o/`,
              takeaway: `OpenAI pulled an update because ChatGPT got too flattering after it was tuned on thumbs-up feedback.`,
              why: `A real case where optimizing for 'liked' made the AI less honest.`,
              surprised: `The flattery came from training on thumbs-up feedback, so the AI got worse by trying to be liked.`,
              quote: `` },
            { type: `paper`, title: `Towards Understanding Sycophancy in Language Models`, authors: `Sharma et al. (Anthropic)`, year: `2023`, venue: `arXiv / ICLR 2024`, url: `https://arxiv.org/abs/2310.13548`,
              takeaway: `AI assistants tend to tell people what they want to hear, partly because people rate that higher.`,
              why: `The flattery comes partly from us, which makes it a human story too.`,
              surprised: `People rate agreeable answers higher, so part of the problem comes from us.`,
              quote: `` }

        },
        {
          id: `q3`, text: `Does a chatbot that always agrees with us leave us more connected, or lonelier?`,
          sources: [
            { type: `paper`, title: `How AI and Human Behaviors Shape Psychosocial Effects of Extended Chatbot Use: A Longitudinal Randomized Controlled Study`, authors: `Fang et al. (MIT Media Lab & OpenAI)`, year: `2025`, venue: `arXiv preprint`, url: `https://arxiv.org/abs/2503.17473`,
              takeaway: `In a 4-week study, people who used chatbots most felt lonelier and more dependent.`,
              why: `Suggests 'more engagement' and 'better for people' can pull apart.`,
              surprised: `The heaviest users felt lonelier and more dependent, the opposite of what you'd hope for.`,
              quote: `` },
            { type: `paper`, title: `AI Companions Reduce Loneliness`, authors: `De Freitas et al.`, year: `2025`, venue: `Journal of Consumer Research`, url: `https://doi.org/10.1093/jcr/ucaf040`,
              takeaway: `AI companions eased loneliness in the short term, mainly by making people feel heard.`,

  crossLinks: [
    { a: `h3/q3`, b: `h5/q1`, note: `trust and over-reliance` },
    { a: `h2/q1`, b: `h4/q1`, note: `authorship vs. "doing it for me"` },
    { a: `h1/q1`, b: `h5/q3`, note: `music bonding vs. AI loneliness` }
  ],

  // Progress Update 2 panel. Empty strings show as placeholders.
  // Separate paragraphs with a blank line.
  // Mirrors the three parts of the assignment.
  progressUpdate2: {
    // 1. Findings. Per-source findings live on each source above.
    whatIFound: `The biggest pattern across my sources is that people's relationship with a technology is shaped less by what it can do and more by how it's designed to involve them. The synchrony studies show that simply moving in time together makes people like and cooperate with each other more, so music's power seems to come from participating, not just listening.

On the AI side, the same idea shows up as a warning. When a tool does the work for us, we feel less ownership (the Ghostwriter effect), we learn less (Bastani et al.), we think less critically (Lee et al.), and heavy use can leave us lonelier (Fang et al.).

What surprised me most was how often the difference came down to small design choices: a hint-only tutor instead of an answer machine, simple steering controls in Cococo, or a thumbs-up signal that accidentally trained ChatGPT to flatter. Design isn't neutral here. It decides whether AI empowers people or quietly replaces their effort.`,
    otherResearch: `Planned: interview one of the NYU experts below, and keep a short journal of my own AI use while making things, noting when it feels like help and when it feels like it's doing the work for me.`,

    // 2. Reflection + refined diagram
    howSourcesConnect: `My sources fall into three threads that cut across the five hunches.

Participation creates value. Synchrony (Hove & Risen; Wiltermuth & Heath), music-making together (Tarr et al.; Savage et al.), the IKEA effect, and the generation effect all say the same thing from different angles: we bond with, value, and remember what we actively take part in.

Over-trust is an old human pattern. Kids trusting voice assistants (Druga et al.; Girouard-Hallam & Danovitch), automation complacency (Parasuraman & Manzey), and less critical thinking with more AI trust (Lee et al.) suggest AI is inheriting a long history of people handing judgment to machines.

Engagement and wellbeing can pull apart. Dark patterns (Mathur et al.), sycophancy (OpenAI; Sharma et al.), and the chatbot loneliness study (Fang et al.) show that systems optimized to be liked or used more aren't always good for people. De Freitas et al. is the counterpoint: feeling heard can genuinely help.

The design precedents (Cococo, Magenta Studio, Holly+, Khanmigo, Study Mode) sit where these threads meet. Each one tries to keep people participating and in control.`,
    refinedInquirySpace: `My first map was wide: food, fashion, color theory, and lots of skills and possible forms. After researching, I narrowed it to one question about how people relate to AI, with five hunches feeding into it.

Music stayed at the center as my lens, because it's the clearest example of an experience whose value comes from people taking part together. I added trust as its own area: it showed up in almost every source but wasn't on my original map. Turn on "Show what carried into my hunches" on the map to see what carried forward and what I've set aside for now, like food, fashion, and most of my tool skills.`,
    refinedImage: ``,            // optional, e.g. `refined-inquiry-space.png`

    // 3. NYU experts. interview: e.g. `Emailed Oct 20`, `Meeting Nov 3`
    experts: [
      { name: `Dan O'Sullivan`, program: `ITP`, focus: `Shared Minds`,
        relatesTo: `His Shared Minds class looks at how people think and make things together using AI and networked tools. That connects to whether AI brings people together or replaces them (Creating with AI; Trust & dark patterns).`, interview: `` },
      { name: `Pablo Ripollés`, program: `Music Technology & Psychology / MARL`, focus: ``,
        relatesTo: `He studies music, reward, and memory in the brain. That fits Music as a human experience, and the question of whether AI-made music moves us the same way.`, interview: `` },
      { name: `Luisa Pereira`, program: `ITP`, focus: `The Code of Music`,
        relatesTo: `Her Code of Music class teaches music through code and interactive tools, a model for creating with computation while staying the author (Creating with AI; my Max/MSP skills).`, interview: `` }
    ]
  }

<body>

<header class="top">
  <a class="brand" href="#/"><i aria-hidden="true"></i><span id="brandName"></span></a>
  <nav class="crumbs" aria-label="Breadcrumb"><ol id="crumbs"></ol></nav>
  <div class="actions">
    <button class="btn" id="backBtn" type="button" aria-label="Go up one level"><span aria-hidden="true">←</span> Back</button>
    <button class="btn" id="pu2Btn" type="button" aria-haspopup="dialog">Progress Update 2</button>
  </div>
</header>

<main id="stage" aria-label="Inquiry web"><div id="inner"></div></main>

<div id="minimap" aria-hidden="true"></div>
<div id="legend" aria-hidden="true"></div>

<aside id="card" aria-label="Source details" inert></aside>

  <button class="x" type="button" data-close aria-label="Close">×</button>
  <p class="eyebrow" id="stanceTitle" tabindex="-1" data-focus>My stance</p>
  <p class="body" id="stanceBody"></p>
</div>
<div id="pu2" role="dialog" aria-modal="true" aria-labelledby="pu2Title" inert></div>
<div id="tip" role="tooltip"></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DUR = reduce ? 1 : 650;
  const EASE = 'cubic-bezier(.45,0,.2,1)';
  const $ = id => document.getElementById(id);
  const stage = $('stage'), inner = $('inner'), card = $('card'), minimap = $('minimap'), legend = $('legend');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const trunc = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
  const f = n => Math.round(n * 10) / 10;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- index the data ---------- */
  const HUNCH = {};
  DATA.hunches.forEach((h, i) => {
    h.n = i + 1; HUNCH[h.id] = h;
    h.ink = shade(h.color, .56);
    h.tint = alpha(h.color, .3);
    h.questions.forEach((q, j) => {
      q.n = j + 1; q.hunch = h; q.key = h.id + '/' + q.id;
      q.sources.forEach((s, k) => { s.id = 's' + (k + 1); s.q = q; s.key = q.key + '/' + s.id; });
    });
  });
  const ORDER = (DATA.ringOrder || []).filter(id => HUNCH[id]);
  DATA.hunches.forEach(h => { if (!ORDER.includes(h.id)) ORDER.push(h.id); });
  const Q = key => { const [h, q] = key.split('/'); return HUNCH[h] && HUNCH[h].questions.find(x => x.id === q); };
  const related = q => DATA.crossLinks.flatMap(l => l.a === q.key ? [{ q: Q(l.b), note: l.note }] : l.b === q.key ? [{ q: Q(l.a), note: l.note }] : []).filter(r => r.q);

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${[n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(v * (1 - amt))).join(',')})`;
  }
  function alpha(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`;
  }

  /* ---------- routing ---------- */
  function parseHash() {
    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!p.length || p[0] === 'intro') return { key: 'intro' };
    if (p[0] === 'web') return { key: 'web' };
    if (p[0] === 'w') { const w = WORD[p[1]]; return w ? { key: 'w:' + w.slug, word: w } : { key: 'intro' }; }
    const h = HUNCH[p[0]];
    if (!h) return { key: 'intro' };
    const q = p[1] && h.questions.find(x => x.id === p[1]);
    if (!q) return { key: h.id, h };
    const s = p[2] && q.sources.find(x => x.id === p[2]);
    return { key: q.key, h, q, s: s || null };
  }
  // via = the map word you zoomed in through; it takes the thesis web's
  // place in the path, so Back/Esc and breadcrumbs return to that word.
  let via = null;
  function pathOf(key) {
    if (key === 'intro') return ['intro'];
    if (key === 'web' || key.startsWith('w:')) return ['intro', key];
    const mid = via ? 'w:' + via : 'web';
    const [h, q] = key.split('/');
    return q ? ['intro', mid, h, key] : ['intro', mid, h];
  }
  const hashFor = key => key === 'intro' ? '#/' : key.startsWith('w:') ? '#/w/' + key.slice(2) : '#/' + key;
  function parentHash(r) {
    if (r.s) return hashFor(r.key);
    const p = pathOf(r.key);
    return p.length > 1 ? hashFor(p[p.length - 2]) : null;
  }
  function goUp() { const r = parseHash(); const p = parentHash(r); if (p) location.hash = p; }

  /* ---------- drawing helpers ---------- */
  function S(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function E(tag, cls, html, parent) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  function rng(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function blobPath(cx, cy, rx, ry, seed, n = 9, w = .16) {
    const r = rng(seed * 7919 + 13), off = r() * Math.PI * 2, pts = [];
    for (let i = 0; i < n; i++) {
      const a = off + i / n * Math.PI * 2 + (r() - .5) * .35, k = 1 + (r() - .5) * 2 * w;
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    let d = '';
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      if (!i) d += `M${f(p1[0])},${f(p1[1])}`;
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
    }
    return d + 'Z';
  }
  function curve(a, b, bend = .08) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
    return `M${f(a.x)},${f(a.y)} Q${f(mx - dy * bend)},${f(my + dx * bend)} ${f(b.x)},${f(b.y)}`;
  }
  const rad = d => d * Math.PI / 180;

  function geo() {
    const W = stage.clientWidth, H = stage.clientHeight, top = 64, bottom = 24, h = H - top - bottom;
    return { W, H, h, cx: W / 2, cy: top + h / 2, m: Math.min(W, h) };
  }

  /* ---------- scene scaffolding ---------- */
  function newScene(key, g) {
    const el = E('div', 'scene');
    el.dataset.key = key;
    const svg = S('svg', { class: 'scene-svg', width: g.W, height: g.H, 'aria-hidden': 'true' }, el);
    return { key, path: pathOf(key), el, svg, g, gBlobs: S('g', {}, svg), gLinks: S('g', {}, svg), pos: {}, spokes: [], C: { x: g.cx, y: g.cy }, center: null };
  }
  function addNode(sc, o) {
    const a = E('a', 'node dimmable bloom ' + (o.cls || ''), null, sc.root || sc.el);
    a.href = o.href;
    a.style.left = o.x + 'px'; a.style.top = o.y + 'px';
    if (o.color) a.style.setProperty('--c', alpha(o.color, .8));
    a.style.setProperty('--d', (-(o.x + o.y) % 5.5).toFixed(2) + 's');
    if (o.branch) a.dataset.branch = o.branch;
    if (o.key) a.dataset.key = o.key;
    a.innerHTML = `<span class="dot ${o.dotCls || ''}" aria-hidden="true"></span><span class="label side-${o.side}" style="--mw:${o.mw || 240}px">${o.html}</span>`;
    a._x = o.x; a._y = o.y;
    return a;
  }
  function addCenter(sc, cls, html, x, y) {
    const c = E('div', 'center ' + cls, html, sc.root || sc.el);
    c.style.left = x + 'px'; c.style.top = y + 'px';
    c.tabIndex = -1;
    sc.center = c; sc.C = { x, y };
    return c;
  }
  // Spokes start at the edge of the center label so lines never run under text.
  function drawSpokes(sc) {
    if (!sc.center) return;
    sc.gLinks.querySelectorAll('.spoke').forEach(p => p.remove());
    const hw = sc.center.offsetWidth / 2 + 16, hh = sc.center.offsetHeight / 2 + 14, C = sc.C;
    sc.spokes.forEach(sp => {
      const dx = sp.to.x - C.x, dy = sp.to.y - C.y;
      const t = Math.min(hw / Math.max(Math.abs(dx), 1e-6), hh / Math.max(Math.abs(dy), 1e-6), .8);
      const from = { x: C.x + dx * t, y: C.y + dy * t };
      S('path', { d: curve(from, sp.to, sp.bend ?? .07), class: 'link spoke dimmable bloom-line', pathLength: 1, 'data-branch': sp.branch || '' }, sc.gLinks);
    });
  }

  /* ---------- level 0: the inquiry space map ---------- */
  const IS = DATA.inquirySpace;
  const REGION = Object.fromEntries(IS.regions.map(r => [r.id, r]));
  const slugify = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const WORD = {};
  IS.words.forEach(w => { w.slug = slugify(w.t); WORD[w.slug] = w; });
  let carryMode = false, winOpen = true;

  // geometry helpers for laying out the map
  function smoothClosed(pts) {
    const n = pts.length;
    let d = '';
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      if (!i) d += `M${f(p1[0])},${f(p1[1])}`;
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
    }
    return d + 'Z';
  }
  function convexHull(pts) {
    pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of pts.reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }
  function rayDist(c, ang, H) {
    const dx = Math.cos(ang), dy = Math.sin(ang);
    let best = 0;
    for (let i = 0; i < H.length; i++) {
      const p = H[i], q = H[(i + 1) % H.length], ex = q[0] - p[0], ey = q[1] - p[1];
      const den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((p[0] - c[0]) * ey - (p[1] - c[1]) * ex) / den, u = ((p[0] - c[0]) * dy - (p[1] - c[1]) * dx) / den;
      if (t > 0 && u >= -1e-6 && u <= 1 + 1e-6) best = Math.max(best, t);
    }
    return best;
  }

  function buildIntro(sc) {
    const I = DATA.intro;
    const fedCount = IS.words.filter(w => w.hunches.length).length;
    const wrap = E('div', 'intro', `
      <div class="imap ${carryMode ? 'carry' : ''}" role="group" aria-label="${esc(I.imageAlt)}"></div>
      <aside class="iwin ${winOpen ? '' : 'min'}" aria-label="About the Inquiry Web">
        <div class="iwin-bar">
          <span class="lights" aria-hidden="true">${DATA.hunches.slice(0, 3).map(h => `<i style="background:${h.color}"></i>`).join('')}</span>
          <span class="ttl">${esc(DATA.title)}</span>
          <button class="iwin-min" type="button" aria-expanded="${winOpen}" aria-label="${winOpen ? 'Minimize' : 'Expand'} the Inquiry Web window">${winOpen ? '–' : '+'}</button>
        </div>
        <div class="iwin-body">
          <h1>${esc(DATA.title)}</h1>
          <p class="sub">${esc(DATA.subtitle)}</p>
          <p class="blurb"><strong>${esc(I.label)}:</strong> ${esc(I.blurb)}</p>
          <p class="hint"><span aria-hidden="true">↗</span>Click a word to zoom into the hunches it fed. Words that didn't feed a hunch yet show a note instead.</p>
          <button class="toggle" type="button" aria-pressed="${carryMode}" data-carry><span class="knob" aria-hidden="true"></span>Show what carried into my hunches (${fedCount} of ${IS.words.length})</button>
          <ul class="hunch-list" aria-label="Five hunches">
            ${DATA.hunches.map(h => `<li><a href="#/${h.id}" style="--tint:${h.tint}"><span class="sw" style="background:${h.color}"></span>${esc(h.name)}</a></li>`).join('')}
          </ul>
          <div class="intro-cta">
            <a class="btn btn-primary" href="#/web">Enter the web <span aria-hidden="true">→</span></a>
            <a class="orig" href="${esc(I.image)}" target="_blank" rel="noopener">Original sketch ↗</a>
          </div>
        </div>
      </aside>`, sc.el);
    const map = wrap.querySelector('.imap'), win = wrap.querySelector('.iwin');
    const svg = S('svg', { width: 970, height: 664, 'aria-hidden': 'true' }, map);
    const gb = S('g', {}, svg), gl = S('g', {}, svg);

    const btns = IS.words.map(w => {
      const b = E('button', 'word' + (w.big ? ' big' : '') + (w.quiet ? ' quiet' : '') + (w.hunches.length ? ' fed' : ''), null, map);
      b.type = 'button';
      b.innerHTML = `<span class="t">${esc(w.t)}</span><span class="pips" aria-hidden="true">${w.hunches.map(id => HUNCH[id] ? `<i style="background:${HUNCH[id].color}"></i>` : '').join('')}</span>`;
      b.setAttribute('aria-label', `${w.t}: ${w.hunches.length ? 'zoom into ' + w.hunches.length + ' hunch' + (w.hunches.length > 1 ? 'es' : '') : 'not in a hunch yet'}`);
      b._w = w;
      return b;
    });

    // 1) nudge words apart until none overlap, 2) grow each region's shape around its words
    function layout() {
      const PAD = 5;
      const B = btns.map(b => ({ b, w: b._w, x: b._w.x, y: b._w.y,
        bw: b.offsetWidth + b._w.hunches.length * 7 + 2, bh: b.offsetHeight }));
      for (let it = 0; it < 300; it++) {
        let moved = false;
        for (let i = 0; i < B.length; i++) for (let j = i + 1; j < B.length; j++) {
          const p = B[i], q = B[j];
          const ox = Math.min(p.x - 4 + p.bw, q.x - 4 + q.bw) - Math.max(p.x - 4, q.x - 4) + PAD;
          const oy = Math.min(p.y + p.bh / 2, q.y + q.bh / 2) - Math.max(p.y - p.bh / 2, q.y - q.bh / 2) + PAD;
          if (ox <= 0 || oy <= 0) continue;
          moved = true;
          if (oy <= ox) { const d = (p.y < q.y || (p.y === q.y && i < j) ? -1 : 1) * oy / 2; p.y += d; q.y -= d; }
          else { const d = (p.x < q.x ? -1 : 1) * ox / 2; p.x += d; q.x -= d; }
        }
        if (!moved) break;
      }
      B.forEach(o => { o.b.style.left = f(o.x) + 'px'; o.b.style.top = f(o.y) + 'px'; o.b._x = o.x; o.b._y = o.y; });

      gb.innerHTML = ''; gl.innerHTML = '';
      const bb = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
      const grow = (x, y) => { bb.x0 = Math.min(bb.x0, x); bb.y0 = Math.min(bb.y0, y); bb.x1 = Math.max(bb.x1, x); bb.y1 = Math.max(bb.y1, y); };
      B.forEach(o => { grow(o.x - 4, o.y - o.bh / 2); grow(o.x - 4 + o.bw, o.y + o.bh / 2); });
      IS.regions.forEach((r, ri) => {
        const mine = B.filter(o => o.w.r === r.id);
        if (!mine.length) return;
        const px = 20, py = 18, pts = [];
        mine.forEach(o => {
          const l = o.x - 4 - px, rr = o.x - 4 + o.bw + px, t = o.y - o.bh / 2 - py, bt = o.y + o.bh / 2 + py;
          pts.push([l, t], [rr, t], [l, bt], [rr, bt], [(l + rr) / 2, t - 6], [(l + rr) / 2, bt + 6]);
        });
        const H = convexHull(pts);
        const c = [H.reduce((s, p) => s + p[0], 0) / H.length, H.reduce((s, p) => s + p[1], 0) / H.length];
        const rnd = rng(ri * 97 + 7), N = 18, off = rnd() * Math.PI;
        const ring = [];
        for (let i = 0; i < N; i++) {
          const ang = off + i / N * Math.PI * 2, d = rayDist(c, ang, H) * (1.07 + rnd() * .06);
          ring.push([c[0] + Math.cos(ang) * d, c[1] + Math.sin(ang) * d]);
        }
        ring.forEach(p => grow(p[0], p[1]));
        S('path', { d: smoothClosed(ring), fill: r.color, 'fill-opacity': .32, class: 'rblob', style: `animation-delay:-${ri * 3}s` }, gb);
        // region label sits just outside the shape, on the side it had in the sketch
        const [lx0, ly0, rot] = r.labelAt;
        const la = Math.atan2(ly0 - c[1], lx0 - c[0]);
        const t = S('text', { 'text-anchor': 'middle', 'dominant-baseline': 'middle', class: 'rlabel', fill: shade(r.color, .5) }, gl);
        t.textContent = r.label;
        const half = (t.getComputedTextLength ? t.getComputedTextLength() : r.label.length * 6.6) / 2;
        const ra = rad(rot), ux = Math.cos(ra), uy = Math.sin(ra);
        // walk outward until no point along the (rotated) label touches a word
        const clear = (lx, ly) => {
          for (let k = -half; k <= half; k += 6) for (const v of [-7, 0, 7]) {
            const px = lx + ux * k - uy * v, py = ly + uy * k + ux * v;
            if (B.some(o => px > o.x - 7 && px < o.x - 1 + o.bw && py > o.y - o.bh / 2 - 3 && py < o.y + o.bh / 2 + 3)) return false;
          }
          return true;
        };
        let ld = rayDist(c, la, H) * 1.08 + 12, lx, ly;
        for (let step = 0; step < 30; step++, ld += 6) {
          lx = c[0] + Math.cos(la) * ld; ly = c[1] + Math.sin(la) * ld;
          if (clear(lx, ly)) break;
        }
        t.setAttribute('x', f(lx)); t.setAttribute('y', f(ly));
        t.setAttribute('transform', `rotate(${rot} ${f(lx)} ${f(ly)})`);
        [-half, half].forEach(k => [-9, 9].forEach(v => grow(lx + ux * k - uy * v, ly + uy * k + ux * v)));
      });
      // words that sit where every region overlaps (Music) get their own bubble, drawn on top
      const shared = B.filter(o => !REGION[o.w.r]);
      if (shared.length) {
        const x0 = Math.min(...shared.map(o => o.x - 4)), x1 = Math.max(...shared.map(o => o.x - 4 + o.bw));
        const y0 = Math.min(...shared.map(o => o.y - o.bh / 2)), y1 = Math.max(...shared.map(o => o.y + o.bh / 2));
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = (x1 - x0) / 2 + 40, ry = (y1 - y0) / 2 + 30;
        // a soft pastel bubble mixing every region's color, feathered at the edge
        const uid = 'ov' + Math.random().toString(36).slice(2, 7);
        const defs = S('defs', {}, gb);
        const grad = S('linearGradient', { id: uid + 'g', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
        IS.regions.forEach((r, i) => S('stop', { offset: f(i / (IS.regions.length - 1) * 100) + '%', 'stop-color': r.color }, grad));
        const blur = S('filter', { id: uid + 'f', x: '-30%', y: '-30%', width: '160%', height: '160%' }, defs);
        S('feGaussianBlur', { stdDeviation: 3.5 }, blur);
        const d = blobPath(cx, cy, rx, ry, 5, 9, .08);
        S('path', { d, fill: '#fffdf8', 'fill-opacity': .96, filter: `url(#${uid}f)`, class: 'overlap-bubble' }, gb);
        S('path', { d, fill: `url(#${uid}g)`, 'fill-opacity': .6, filter: `url(#${uid}f)`, class: 'overlap-bubble' }, gb);
        const t = S('text', { x: f(cx), y: f(cy + ry + 14), 'text-anchor': 'middle', class: 'rlabel overlap-label' }, gl);
        t.textContent = 'Where everything overlaps';
        grow(cx - rx, cy - ry - 18); grow(cx + rx, cy + ry);
      }
      const at = {};
      B.forEach(o => { at[o.w.t] = o; });
      IS.lines.forEach(([a, b]) => {
        const p = at[a], q = at[b];
        if (p && q) S('path', { d: curve({ x: p.x, y: p.y }, { x: q.x, y: q.y }, .12), class: 'sketch' }, gl);
      });
      return bb;
    }

    let bounds = null;
    function fit() {
      const W = sc.el.clientWidth, Ht = sc.el.clientHeight;
      const side = winOpen && W > 760 ? win.offsetLeft + win.offsetWidth + 16 : 24;
      const box = { x: side, y: 72, w: W - side - 24, h: Ht - 72 - 20 };
      const bw = bounds.x1 - bounds.x0, bh = bounds.y1 - bounds.y0;
      const s = Math.min(box.w / bw, box.h / bh, 1.6);
      const tx = box.x + (box.w - bw * s) / 2 - bounds.x0 * s, ty = box.y + (box.h - bh * s) / 2 - bounds.y0 * s;
      map.style.transform = `translate(${f(tx)}px,${f(ty)}px) scale(${s.toFixed(4)})`;
      sc.pos.web = { x: box.x + box.w / 2, y: box.y + box.h / 2 };
    }
    // zoom transitions start from the clicked word
    const wordPos = b => { const r = b.getBoundingClientRect(), s0 = sc.el.getBoundingClientRect(); return { x: r.left - s0.left + 8, y: r.top - s0.top + r.height / 2 }; };

    const pop = E('div', 'wordpop', null, sc.el);
    pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Word details');
    pop.inert = true;
    sc.closePop = (refocus) => {
      if (!pop.classList.contains('on')) return false;
      pop.classList.remove('on'); pop.inert = true;
      const on = map.querySelector('.word.on');
      if (on) { on.classList.remove('on'); if (refocus) on.focus({ preventScroll: true }); }
      return true;
    };
    function openPop(b) {
      const w = b._w, r = REGION[w.r] || {};
      map.querySelectorAll('.word.on').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      pop.innerHTML = `
        <button class="x" type="button" data-popclose aria-label="Close">×</button>
        <p class="eyebrow" style="color:${r.color ? shade(r.color, .55) : 'inherit'}">${esc(r.label || 'Where the regions overlap')}</p>
        <p class="w">${esc(w.t)}</p>
        <p class="none">Part of my inquiry space, but not in a hunch yet.</p>`;
      const br = b.getBoundingClientRect(), sr = sc.el.getBoundingClientRect();
      const x = br.left - sr.left, y = br.top - sr.top;
      pop.classList.add('on'); pop.inert = false;
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      pop.style.left = clamp(x - 10, 12, sr.width - pw - 12) + 'px';
      pop.style.top = (y + br.height + 10 + ph > sr.height - 12 ? y - ph - 10 : y + br.height + 10) + 'px';
      if (kb) requestAnimationFrame(() => pop.querySelector('.x').focus({ preventScroll: true }));
    }
    map.addEventListener('click', e => {
      const b = e.target.closest('.word');
      if (!b) return;
      e.stopPropagation();
      if (b._w.hunches.length) {
        sc.closePop();
        sc.pos['w:' + b._w.slug] = wordPos(b);
        location.hash = hashFor('w:' + b._w.slug);
      } else b.classList.contains('on') ? sc.closePop() : openPop(b);
    });
    pop.addEventListener('click', e => { if (e.target.closest('[data-popclose]')) sc.closePop(true); });
    sc.el.addEventListener('click', e => { if (!e.target.closest('.wordpop, .word')) sc.closePop(); });
    wrap.querySelector('[data-carry]').addEventListener('click', e => {
      carryMode = !carryMode;
      e.currentTarget.setAttribute('aria-pressed', carryMode);
      map.classList.toggle('carry', carryMode);
    });
    const minBtn = wrap.querySelector('.iwin-min');
    minBtn.addEventListener('click', () => {
      winOpen = !winOpen;
      win.classList.toggle('min', !winOpen);
      minBtn.textContent = winOpen ? '–' : '+';
      minBtn.setAttribute('aria-expanded', winOpen);
      minBtn.setAttribute('aria-label', `${winOpen ? 'Minimize' : 'Expand'} the Inquiry Web window`);
      sc.closePop();
      fit();
    });

    sc.center = wrap.querySelector('h1'); sc.center.tabIndex = -1;
    sc.after = () => {
      bounds = layout();
      map.style.transition = 'none';
      fit();
      map.getBoundingClientRect();
      map.style.transition = '';
      map.classList.add('ready');
      btns.forEach(b => { if (b._w.hunches.length) sc.pos['w:' + b._w.slug] = wordPos(b); });
    };
  }

  /* ---------- level 1: thesis web ---------- */
  function ringGeometry(W, h, cx, cy, brFixed) {
    const rx = Math.min(W * .3, 520), ry = h * .335, br = brFixed || clamp(Math.min(W, h) * .14, 70, 128);
    const pts = {};
    ORDER.forEach((id, i) => {
      const a = rad(-90 + i * 360 / ORDER.length);
      pts[id] = { x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry };
    });
    return { rx, ry, br, pts };
  }
  function buildWeb(sc, g) {
    const C = { x: g.cx, y: g.cy };
    const { br, pts } = ringGeometry(g.W, g.h, C.x, C.y);
    addCenter(sc, 'center-web', `
      <span class="center-dot" aria-hidden="true"></span>
      <p class="eyebrow">Thesis question</p>
      <h1 class="thesis-q">${esc(DATA.thesisQuestion)}</h1>
      <button class="chip" type="button" data-stance><i aria-hidden="true"></i>My stance</button>`, C.x, C.y);

    ORDER.forEach(id => drawHunch(sc, HUNCH[id], pts[id], C, br));
    drawCrossLinks(sc, C);
    sc.after = () => drawSpokes(sc);
  }

  // A hunch as it appears on the web: blob, node, and its question dots.
  function drawHunch(sc, h, pt, C, br, sub) {
    const id = h.id, { x, y } = pt;
    const side = x < C.x - 1 ? 'left' : 'right', hs = side === 'left' ? -1 : 1, vs = y < C.y ? -1 : 1;
    S('path', { d: blobPath(x + hs * br * .34, y + vs * br * .16, br * 1.1, br * .92, h.n), fill: h.color, 'fill-opacity': .42,
      class: 'blob dimmable', 'data-branch': id, style: `animation-delay:-${h.n * 3.3}s` }, sc.gBlobs);
    addNode(sc, { x, y, href: '#/' + id, side, cls: 'node-hunch', branch: id, color: h.color, mw: sub ? 230 : 210, key: id,
      html: `<span class="l-name">${esc(h.name)}</span><span class="l-sub">${sub ? esc(sub) : `${h.questions.length} question${h.questions.length === 1 ? '' : 's'}`}</span>` });
    sc.pos[id] = { x, y };
    sc.spokes.push({ to: { x, y }, branch: id });
    // small question dots, fanned away from the center
    const base = vs < 0 ? -90 : 90, n = h.questions.length, d = br * .62;
    h.questions.forEach((q, j) => {
      const a = rad(n > 1 ? base - 46 + j * 92 / (n - 1) : base);
      const mx = x + Math.cos(a) * d, my = y + Math.sin(a) * d;
      S('path', { d: `M${f(x)},${f(y)} L${f(mx)},${f(my)}`, class: 'link faint dimmable bloom-line', pathLength: 1, 'data-branch': id }, sc.gLinks);
      const m = E('a', 'mini dimmable bloom', null, sc.el);
      m.href = '#/' + q.key; m.tabIndex = -1; m.setAttribute('aria-hidden', 'true');
      m.dataset.branch = id; m.dataset.q = q.key;
      m.style.left = mx + 'px'; m.style.top = my + 'px'; m._x = mx; m._y = my;
      sc.pos[q.key] = { x: mx, y: my };
    });
  }
  // cross-links bow outward so they stay clear of the center
  function drawCrossLinks(sc, C) {
    DATA.crossLinks.forEach(l => {
      const a = sc.pos[l.a], b = sc.pos[l.b];
      if (!a || !b) return;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const ux = mx - C.x, uy = my - C.y, L = Math.hypot(ux, uy) || 1, k = Math.hypot(b.x - a.x, b.y - a.y) * .3;
      S('path', { d: `M${f(a.x)},${f(a.y)} Q${f(mx + ux / L * k)},${f(my + uy / L * k)} ${f(b.x)},${f(b.y)}`,
        class: 'link cross dimmable bloom-fade', 'data-branch': `${l.a.split('/')[0]} ${l.b.split('/')[0]}`, 'data-x': `${l.a} ${l.b}` }, sc.gLinks);
    });
  }

  /* ---------- level 1b: a word from the map, zoomed in ---------- */
  // Word page: a readable list of the hunches the word fed, with their questions.
  function buildWordList(sc, w) {
    const r = REGION[w.r] || {};
    const hs = w.hunches.map(id => HUNCH[id]).filter(Boolean);
    sc.list = true;
    const lp = E('div', 'lp', `<div class="lp-col">
      <header class="lp-head">
        <p class="eyebrow" style="color:${r.color ? shade(r.color, .55) : 'var(--ink-3)'}">${esc(r.label || 'Where everything overlaps')}</p>
        <h1 tabindex="-1">${esc(w.t)}</h1>
        <p class="lp-sub">${hs.length ? `Shows up in ${hs.length} of my hunches` : 'Not in a hunch yet'}</p>
      </header>
      ${hs.map(h => `
        <section class="lp-hunch bloom-row" style="--tint:${h.tint}" data-key="${h.id}">
          <p class="eyebrow" style="color:${h.ink}">Hunch ${h.n}</p>
          <h2><a href="#/${h.id}">${esc(h.name)} <span aria-hidden="true">→</span></a></h2>
          <p class="bl">${esc(h.blurb)}</p>
          <ul class="lp-qs">${h.questions.map(q => `
            <li><a class="lp-q" href="#/${q.key}" data-key="${q.key}"><em>${esc(q.text)}</em><span class="m">${q.sources.length} source${q.sources.length === 1 ? '' : 's'} →</span></a></li>`).join('')}
          </ul>
        </section>`).join('')}
    </div>`, sc.el);
    sc.center = lp.querySelector('h1');
    sc.after = () => listPositions(sc, lp);
  }

  // Question page: the sources as a list; selecting one opens the source window.
  function buildQuestionList(sc, q) {
    const h = q.hunch, rels = related(q);
    sc.list = true;
    const lp = E('div', 'lp', `<div class="lp-col">
      <header class="lp-head">
        <p class="eyebrow" style="color:${h.ink}"><span class="sw" style="background:${h.color}"></span>Hunch ${h.n} · ${esc(h.name)} · Question ${q.n}</p>
        <h1 class="q" tabindex="-1">${esc(q.text)}</h1>
        ${rels.length ? `<div class="rels lp-rels">${rels.map(r => `
          <a class="rel-chip" href="#/${r.q.key}" title="${esc(r.note)}">
            <span class="sw" style="background:${r.q.hunch.color}"></span>
            <span><span class="k">Related in another hunch → ${esc(r.q.hunch.name)}</span><span class="t">${esc(r.q.text)}</span></span>
          </a>`).join('')}</div>` : ''}
      </header>
      <p class="lp-count">${q.sources.length} source${q.sources.length === 1 ? '' : 's'}</p>
      <ol class="lp-srcs" style="--tint:${h.tint}">${q.sources.map(s => `
        <li class="bloom-row"><a class="lp-src" href="#/${s.key}" data-key="${s.key}">
          <i class="mk ${s.type === 'project' ? 'ring' : ''}" aria-hidden="true"></i>
          <span class="body">
            <span class="ty">${s.type === 'project' ? 'Project' : 'Paper'}</span>
            <span class="ti">${esc(s.title)}</span>
            <span class="me">${esc(s.authors)} · ${esc(s.year)} · ${esc(s.venue)}</span>
            <span class="tk">${esc(s.takeaway)}</span>
          </span>
        </a><a class="lp-read" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${s.type === 'project' ? 'Visit' : 'Read'} <span aria-hidden="true">↗</span><span class="sr-only"> ${esc(s.title)} (opens in a new tab)</span></a></li>`).join('')}
      </ol>
    </div>`, sc.el);
    sc.center = lp.querySelector('h1');
    sc.after = () => listPositions(sc, lp);
  }

  // where each row sits, so zooms in and out start from the right place
  function listPositions(sc, lp) {
    const s0 = sc.el.getBoundingClientRect();
    lp.querySelectorAll('[data-key]').forEach(el => {
      const r = el.getBoundingClientRect();
      sc.pos[el.dataset.key] = { x: r.left - s0.left + Math.min(r.width / 2, 200), y: r.top - s0.top + Math.min(r.height / 2, 40) };
    });
  }

  /* ---------- level 2: hunch ---------- */
  const fan = (n, sets) => sets[n] || Array.from({ length: n }, (_, i) => -90 + i * 360 / n);
  function buildHunch(sc, g, h) {
    const C = { x: g.cx, y: g.cy + g.h * .02 };
    S('path', { d: blobPath(C.x, C.y, Math.min(g.W * .36, 600), g.h * .45, h.n + 10, 10, .13), fill: h.color, 'fill-opacity': .3, class: 'blob' }, sc.gBlobs);
    S('path', { d: blobPath(C.x - g.W * .05, C.y + g.h * .04, Math.min(g.W * .2, 330), g.h * .26, h.n + 20), fill: h.color, 'fill-opacity': .26, class: 'blob', style: 'animation-delay:-7s' }, sc.gBlobs);
    addCenter(sc, 'center-hunch', `
      <p class="eyebrow" style="color:${h.ink}">Hunch ${h.n}</p>
      <h2>${esc(h.name)}</h2>
      <p class="blurb">${esc(h.blurb)}</p>`, C.x, C.y);
    const rx = Math.min(g.W * .31, 500), ry = g.h * .34;
    const angles = fan(h.questions.length, { 1: [-90], 2: [-150, -30], 3: [-150, -30, 90] });
    h.questions.forEach((q, i) => {
      const a = rad(angles[i]), x = C.x + Math.cos(a) * rx, y = C.y + Math.sin(a) * ry;
      const rel = related(q).length, n = q.sources.length;
      addNode(sc, { x, y, href: '#/' + q.key, side: y < C.y - 1 ? 'above' : 'below', branch: q.key, color: h.color, mw: 270, key: q.key,
        html: `<span class="l-q">${esc(q.text)}</span><span class="l-meta">${n} source${n === 1 ? '' : 's'}${rel ? ` · <span class="l-rel">↔ linked to another hunch</span>` : ''}</span>` });
      sc.pos[q.key] = { x, y };
      sc.spokes.push({ to: { x, y }, branch: q.key });
    });
    sc.after = () => drawSpokes(sc);
  }

  function build(route, g) {
    const sc = newScene(route.key, g);
    if (route.key === 'intro') buildIntro(sc);
    else if (route.key === 'web') buildWeb(sc, g);
    else if (route.word) buildWordList(sc, route.word);
    else if (route.q) buildQuestionList(sc, route.q);
    else buildHunch(sc, g, route.h);
    wireHover(sc);
    return sc;
  }
  function mount(sc) {
    inner.appendChild(sc.el);
    if (sc.after) sc.after();
    if (sc.k) for (const key in sc.pos) sc.pos[key] = { x: sc.pos[key].x * sc.k, y: sc.pos[key].y * sc.k };
  }

  /* ---------- hover: highlight a branch ---------- */
  const tip = $('tip');
  function setHL(sc, b) {
    sc.el.classList.toggle('dimming', !!b);
    sc.el.querySelectorAll('[data-branch]').forEach(e => e.classList.toggle('hl', !!b && e.dataset.branch.split(' ').includes(b)));
  }
  function wireHover(sc) {
    sc.el.addEventListener('mouseover', e => {
      const n = e.target.closest('.node[data-branch]');
      if (n) setHL(sc, n.dataset.branch);
      const m = e.target.closest('.mini');
      if (m) showTip(m, sc);
    });
    sc.el.addEventListener('mouseout', e => {
      const n = e.target.closest('.node[data-branch], .mini');
      if (n && !n.contains(e.relatedTarget)) { setHL(sc, null); hideTip(sc); }
    });
    sc.el.addEventListener('focusin', e => { const n = e.target.closest('.node[data-branch]'); if (n) setHL(sc, n.dataset.branch); });
    sc.el.addEventListener('focusout', () => setHL(sc, null));
  }
  function showTip(m, sc) {
    const q = Q(m.dataset.q), h = q.hunch, rels = related(q);
    tip.innerHTML = `<span class="h"><span class="sw" style="background:${h.color}"></span>${esc(h.name)}</span><em>${esc(q.text)}</em>` +
      rels.map(r => `<span class="x2">┄ ${esc(r.note)} · ${esc(r.q.hunch.name)}</span>`).join('');
    sc.svg.querySelectorAll('.cross').forEach(p => p.classList.toggle('xhl', p.dataset.x.split(' ').includes(q.key)));
    const r = m.getBoundingClientRect();
    tip.classList.add('on');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp(r.left - tw / 2, 12, innerWidth - tw - 12) + 'px';
    tip.style.top = (r.top - th - 14 < 70 ? r.bottom + 14 : r.top - th - 14) + 'px';
  }
  function hideTip(sc) {
    tip.classList.remove('on');
    sc.svg.querySelectorAll('.cross.xhl').forEach(p => p.classList.remove('xhl'));
  }

  /* ---------- motion ---------- */
  function findPos(pos, key) {
    const p = pathOf(key);
    for (let i = p.length - 1; i >= 0; i--) if (pos[p[i]]) return pos[p[i]];
    return null;
  }
  const isPrefix = (a, b) => a.length < b.length && a.every((x, i) => x === b[i]);
  const tf = (x, y, s) => `translate(${f(x)}px,${f(y)}px) scale(${s})`;

  function bloom(sc) {
    if (reduce) return;
    if (sc.list) {
      sc.el.querySelectorAll('.lp-head, .bloom-row, .lp-count').forEach((el, i) =>
        el.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }],
          { duration: 560, delay: 140 + i * 60, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'backwards' }));
      return;
    }
    const C = sc.C;
    if (sc.center && sc.center.classList.contains('center')) sc.center.animate([{ opacity: 0, transform: 'translate(-50%,-50%) scale(.94)' }, { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }],
      { duration: 600, delay: 120, easing: EASE, fill: 'backwards' });
    sc.el.querySelectorAll('.bloom').forEach((k, i) => {
      k.animate([{ transform: `translate(${f((C.x - k._x) * .6)}px,${f((C.y - k._y) * .6)}px)`, opacity: 0 }, { transform: 'translate(0,0)', opacity: 1 }],
        { duration: 760, delay: 200 + i * 55, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'backwards' });
    });
    sc.svg.querySelectorAll('.bloom-line').forEach((l, i) => {
      l.animate([{ strokeDasharray: '1 1', strokeDashoffset: 1 }, { strokeDasharray: '1 1', strokeDashoffset: 0 }],
        { duration: 820, delay: 160 + i * 35, easing: EASE, fill: 'backwards' });
    });
    sc.svg.querySelectorAll('.bloom-fade').forEach(l => l.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: 700, fill: 'backwards' }));
    sc.gBlobs.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: 60, easing: EASE, fill: 'backwards' });
  }

  function transition(old, nw) {
    const g = nw.g, C = { x: g.cx, y: g.cy }, s = 2.6, k = .3;
    const op = old.path, np = nw.path;
    const opts = { duration: DUR, easing: EASE };
    old.el.inert = true; old.el.style.pointerEvents = 'none';
    let oa;
    if (isPrefix(op, np)) {            // deeper: dive into the clicked node
      const p = findPos(old.pos, nw.key) || C;
      oa = old.el.animate([{ transform: tf(0, 0, 1), opacity: 1 }, { transform: tf(C.x - s * p.x, C.y - s * p.y, s), opacity: 0 }], { ...opts, fill: 'forwards' });
      nw.el.animate([{ transform: tf(p.x - k * C.x, p.y - k * C.y, k), opacity: 0 }, { transform: tf(0, 0, 1), opacity: 1 }], opts);
      bloom(nw);
    } else if (isPrefix(np, op)) {     // up: shrink back into the parent node
      const q = findPos(nw.pos, old.key) || C;
      oa = old.el.animate([{ transform: tf(0, 0, 1), opacity: 1 }, { transform: tf(q.x - k * C.x, q.y - k * C.y, k), opacity: 0 }], { ...opts, fill: 'forwards' });
      nw.el.animate([{ transform: tf(C.x - s * q.x, C.y - s * q.y, s), opacity: 0 }, { transform: tf(0, 0, 1), opacity: 1 }], opts);
    } else {                           // sideways: soft crossfade
      oa = old.el.animate([{ opacity: 1, transform: tf(0, 0, 1) }, { opacity: 0, transform: tf(C.x * .04, C.y * .04, .96) }], { ...opts, fill: 'forwards' });
      nw.el.animate([{ opacity: 0, transform: tf(-C.x * .04, -C.y * .04, 1.04) }, { opacity: 1, transform: tf(0, 0, 1) }], { ...opts, delay: 120, fill: 'backwards' });
      bloom(nw);
    }
    oa.onfinish = () => old.el.remove();
  }

  /* ---------- chrome: crumbs, minimap, legend, card ---------- */
  function updateCrumbs(r) {
    const items = [{ label: 'Intro', href: '#/' }];
    const vw = r.word || (via && r.h ? WORD[via] : null);
    if (vw) items.push({ label: `“${vw.t}”`, href: hashFor('w:' + vw.slug) });
    else if (r.key !== 'intro') items.push({ label: 'Thesis', href: '#/web' });
    if (r.h) items.push({ label: r.h.name, href: '#/' + r.h.id, color: r.h.color });
    if (r.q) items.push({ label: trunc(r.q.text, 46), href: '#/' + r.q.key, title: r.q.text, cls: 'q' });
    if (r.s) items.push({ label: trunc(r.s.title, 40), title: r.s.title });
    $('crumbs').innerHTML = items.map((it, i) => {
      const sw = it.color ? `<span class="sw" style="background:${it.color}"></span>` : '';
      const t = it.title ? ` title="${esc(it.title)}"` : '';
      return i === items.length - 1
        ? `<li><span aria-current="page" class="${it.cls || ''}"${t}>${esc(it.label)}</span></li>`
        : `<li><a href="${it.href}" class="${it.cls || ''}"${t}>${sw}${esc(it.label)}</a></li>`;
    }).join('');
    $('backBtn').disabled = r.key === 'intro';
  }

  const mm = { h: {}, q: {} };
  function buildMinimap() {
    const W = 176, H = 112, C = { x: W / 2, y: H / 2 + 2 };
    const { br, pts } = ringGeometry(W, H, C.x, C.y, 13);
    const r = .62;
    const svg = S('svg', { viewBox: `0 0 ${W} ${H}` }, minimap);
    const lines = S('g', {}, svg), body = S('g', {}, svg);
    const qp = {};
    ORDER.forEach(id => {
      const h = HUNCH[id], p = pts[id], vs = p.y < C.y ? -1 : 1;
      S('line', { x1: C.x, y1: C.y, x2: p.x, y2: p.y, stroke: 'rgba(31,29,26,.35)', 'stroke-width': .7 }, lines);
      const a = S('a', { href: '#/' + id, tabindex: -1, class: 'mm-h' }, body);
      mm.h[id] = a;
      S('title', {}, a).textContent = h.name;
      S('path', { d: blobPath(p.x, p.y + vs * 3, br * 1.15, br * .95, h.n), fill: h.color, 'fill-opacity': .55, style: 'mix-blend-mode:multiply' }, a);
      S('circle', { cx: p.x, cy: p.y, r: 2.6 * r * 1.6, fill: '#1f1d1a' }, a);
      const n = h.questions.length, base = vs < 0 ? -90 : 90;
      h.questions.forEach((q, j) => {
        const ang = rad(n > 1 ? base - 46 + j * 92 / (n - 1) : base);
        const x = p.x + Math.cos(ang) * br * .7, y = p.y + Math.sin(ang) * br * .7;
        qp[q.key] = { x, y };
        S('line', { x1: p.x, y1: p.y, x2: x, y2: y, stroke: 'rgba(31,29,26,.3)', 'stroke-width': .5 }, a);
        mm.q[q.key] = [S('circle', { cx: x, cy: y, r: 1.6, class: 'mm-q' }, a), S('circle', { cx: x, cy: y, r: 3.6, class: 'mm-ring' }, a)];
      });
    });
    DATA.crossLinks.forEach(l => {
      const a = qp[l.a], b = qp[l.b];
      if (!a || !b) return;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, ux = mx - C.x, uy = my - C.y, L = Math.hypot(ux, uy) || 1, k = Math.hypot(b.x - a.x, b.y - a.y) * .3;
      S('path', { d: `M${f(a.x)},${f(a.y)} Q${f(mx + ux / L * k)},${f(my + uy / L * k)} ${f(b.x)},${f(b.y)}`, fill: 'none', stroke: 'rgba(31,29,26,.45)', 'stroke-width': .6, 'stroke-dasharray': '1 2' }, lines);
    });
    S('circle', { cx: C.x, cy: C.y, r: 3.4, fill: '#1f1d1a' }, body);
    E('div', 'cap', '', minimap);
  }
  function updateMinimap(r) {
    minimap.classList.toggle('hidden', r.key === 'intro');
    minimap.classList.toggle('focused', !!(r.h || r.word));
    for (const id in mm.h) mm.h[id].classList.toggle('on', r.h ? r.h.id === id : !!r.word && r.word.hunches.includes(id));
    for (const key in mm.q) mm.q[key].forEach(c => c.classList.toggle('cur', !!r.q && r.q.key === key));
    minimap.querySelector('.cap').innerHTML = r.word ? `“<b>${esc(r.word.t)}</b>” across ${r.word.hunches.length} hunch${r.word.hunches.length === 1 ? '' : 'es'}` : r.q ? `You are here: <b>${esc(r.h.name)}</b> · Q${r.q.n}` : r.h ? `You are here: <b>${esc(r.h.name)}</b>` : `You are here: <b>the whole web</b>`;
  }
  function updateLegend(r) {
    legend.classList.toggle('hidden', r.key === 'intro');
    if (r.word) legend.innerHTML = `<span>Select a hunch or a question</span><span>Esc to return to the map</span>`;
    else if (r.key === 'web') legend.innerHTML = `<span>Select a hunch to zoom in</span>
      <span><i class="lm"></i>question</span>
      <span><svg width="26" height="6"><path d="M1 3H25" stroke="#1f1d1a" stroke-opacity=".55" stroke-dasharray="1.5 4" stroke-linecap="round"/></svg>related across hunches</span>`;
    else if (r.q) legend.innerHTML = `<span><i class="ld"></i>paper</span><span><i class="lr"></i>project</span><span>Select a source to open it</span>`;
    else if (r.h) legend.innerHTML = `<span>Select a question to see its sources</span><span>Esc to go back</span>`;
  }

  function fitForCard(open) {
    inner.classList.toggle('card-open', !!open && !!current && !!current.list);
    if (!open || !current || current.list) { inner.style.transform = ''; inner.style.opacity = ''; return; }
    const W = innerWidth, cw = card.offsetWidth + 40, avail = W - cw;
    const g = current.g, half = Math.min(W * .31, 500) + 135;
    const s = clamp(avail / (half * 2), .6, 1);
    const tx = avail / 2 - s * g.cx, ty = g.cy - s * g.cy;
    inner.style.transform = `translate(${f(tx)}px,${f(ty)}px) scale(${s.toFixed(3)})`;
  }
  function updateCard(r) {
    current && current.el.querySelectorAll('.active').forEach(n => n.classList.remove('active'));
    if (!r.s) {
      card.classList.remove('open'); card.inert = true; fitForCard(false);
      return;
    }
    const s = r.s, q = s.q, h = q.hunch, i = q.sources.indexOf(s), prev = q.sources[i - 1], next = q.sources[i + 1];
    card.innerHTML = `
      <div class="card-top">
        <span class="ctx"><span class="sw" style="background:${h.color}"></span>${esc(h.name)} · Q${q.n} · ${i + 1} of ${q.sources.length}</span>
        <a class="x" href="${hashFor(q.key)}" aria-label="Close source">×</a>
      </div>
      <span class="tag"><i class="${s.type === 'project' ? 'lr' : 'ld'}"></i>${s.type === 'project' ? 'Project' : 'Paper'}</span>
      <h2 tabindex="-1">${esc(s.title)}</h2>
      <p class="by">${esc(s.authors)}</p>
      <p class="venue">${esc(s.year)} · ${esc(s.venue)}</p>
      <section><h3>What I learned</h3><p>${esc(s.takeaway)}</p></section>
      <section><h3>What surprised or intrigued me</h3>${s.surprised ? `<p>${esc(s.surprised)}</p>` : `<p class="todo">To fill in: what piqued my interest here.</p>`}</section>
      <section><h3>Quote / passage</h3>${s.quote ? `<blockquote>${esc(s.quote)}</blockquote>` : `<p class="todo">To fill in: a quote, passage, scene, or interaction.</p>`}</section>
      <section class="why"><h3>Why it matters to me</h3><p>${esc(s.why)}</p></section>
      <a class="read" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Read it <span aria-hidden="true">→</span><span class="sr-only"> (opens in a new tab)</span></a>
      <p class="read-url">${esc(s.url.replace(/^https?:\/\//, ''))}</p>
      <nav class="pager" aria-label="Other sources for this question">
        <span>${prev ? `<a href="#/${prev.key}">← ${esc(trunc(prev.title, 34))}</a>` : ''}</span>
        <span>${next ? `<a href="#/${next.key}">${esc(trunc(next.title, 34))} →</a>` : ''}</span>
      </nav>`;
    card.style.setProperty('--c', h.color);
    card.inert = false; card.classList.add('open');
    const n = current && current.el.querySelector(`[data-key="${s.key}"]`);
    if (n) n.classList.add('active');
    fitForCard(true);
    requestAnimationFrame(() => card.querySelector('h2').focus({ preventScroll: true }));
  }

  /* ---------- render ---------- */
  let current = null, kb = false, mobile = null;
  addEventListener('keydown', () => { kb = true; }, true);
  addEventListener('pointerdown', () => { kb = false; }, true);

  function describe(r) {
    if (r.s) return `Source: ${r.s.title}`;
    if (r.q) return `Question: ${r.q.text}`;
    if (r.h) return `Hunch ${r.h.n}: ${r.h.name}`;
    if (r.key === 'web') return 'Thesis web';
    if (r.word) return `Word: ${r.word.t}`;
    return 'Intro';
  }
  function render() {
    const r = parseHash();
    if (r.word) via = r.word.slug;
    else if (!(r.h && via && WORD[via].hunches.includes(r.h.id))) via = null;
    closeOverlays(false);
    hideTipAll();
    document.title = (r.key === 'intro' ? '' : trunc(describe(r).replace(/^\w+ ?\d*: /, ''), 50) + ' · ') + DATA.title + ' · Cathy Doss';
    if (mobile) return renderList(r);
    updateCrumbs(r); updateMinimap(r); updateLegend(r);
    $('live').textContent = describe(r);
    if (!current || current.key !== r.key) {
      const sc = build(r, geo());
      mount(sc);
      if (current) transition(current, sc); else bloom(sc);
      current = sc;
      if (kb && !r.s && sc.center) sc.center.focus({ preventScroll: true });
    }
    updateCard(r);
  }
  function hideTipAll() { tip.classList.remove('on'); }
  function rebuild() {
    const r = parseHash();
    if (r.word) via = r.word.slug;
    if (current) current.el.remove();
    inner.querySelectorAll('.scene').forEach(e => e.remove());
    current = build(r, geo());
    mount(current);
    updateCard(r);
  }

  /* ---------- overlays: stance & Progress Update 2 ---------- */
  const scrim = $('scrim'), stance = $('stance'), pu2 = $('pu2');
  let lastFocus = null;
  function openOverlay(el) {
    lastFocus = document.activeElement;
    scrim.classList.add('on'); el.inert = false; el.classList.add('open');
    requestAnimationFrame(() => el.querySelector('[data-focus]').focus({ preventScroll: true }));
  }
  function closeOverlays(restore = true) {
    const open = [stance, pu2].filter(e => e.classList.contains('open'));
    open.forEach(e => { e.classList.remove('open'); e.inert = true; });
    scrim.classList.remove('on');
    if (open.length && restore && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    return open.length > 0;
  }
  // Names like "Hove & Risen", "Bastani et al." or "Cococo" in the write-up link to the paper.
  const CITES = (() => {
    const all = DATA.hunches.flatMap(h => h.questions.flatMap(q => q.sources));
    const names = new Map();
    const add = (name, s) => { if (!name) return; names.set(name, names.has(name) && names.get(name) !== s ? null : s); };
    all.forEach(s => {
      const a = s.authors.replace(/\s*\(.*\)\s*$/, '').trim();
      add(a, s);
      const people = a.split(/,|&/).map(x => x.trim()).filter(Boolean);
      if (people.length >= 3) add(people[0] + ' et al.', s);
      (s.aka || []).forEach(n => add(n, s));
      if (s.type === 'project') add(s.title, s);
    });
    return [...names].filter(([, s]) => s).sort((a, b) => b[0].length - a[0].length);
  })();
  const citeRe = new RegExp(CITES.map(([n]) => esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
  const citeMap = new Map(CITES.map(([n, s]) => [esc(n), s]));
  const linkCites = html => CITES.length ? html.replace(citeRe, m => {
    const s = citeMap.get(m);
    return `<a class="cite" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" title="${esc(s.title)}">${m}</a>`;
  }) : html;
  const paras = (txt, ph) => txt && txt.trim()
    ? txt.trim().split(/\n\s*\n/).map(p => `<p>${linkCites(esc(p))}</p>`).join('')
    : `<p class="ph">${ph}</p>`;
  function buildPU2() {
    const P = DATA.progressUpdate2;
    const qs = DATA.hunches.flatMap(h => h.questions), ss = qs.flatMap(q => q.sources);
    const proj = ss.filter(s => s.type === 'project').length;
    const filled = k => ss.filter(s => s[k] && s[k].trim()).length;
    const mark = (on, label) => `<i class="mk ${on ? 'on' : ''}" title="${label}: ${on ? 'recorded' : 'to fill in'}"></i>`;
    pu2.innerHTML = `
      <button class="x" type="button" data-close aria-label="Close">×</button>
      <p class="eyebrow">Progress Update 2</p>
      <h2 id="pu2Title" tabindex="-1" data-focus>Research findings + refined inquiry space</h2>
      <div class="stats">
        <div><b>${DATA.hunches.length}</b>hunches</div><div><b>${qs.length}</b>questions</div>
        <div><b>${ss.length - proj}</b>papers</div><div><b>${proj}</b>projects</div>
      </div>

      <section>
        <h3><span class="n">01</span>Research findings</h3>
        <p class="ask">From each source: what did I learn, and what piqued my interest, surprised or intrigued me? Specific quotes, passages, scenes, images, interactions.</p>
        <div class="meter">
          <span><b>${filled('takeaway')}/${ss.length}</b> learned</span>
          <span><b>${filled('surprised')}/${ss.length}</b> surprises</span>
          <span><b>${filled('quote')}/${ss.length}</b> quotes / passages</span>
        </div>
        <h4>Across everything</h4>
        ${paras(P.whatIFound, 'To fill in: what stood out across all my sources.')}
        <h4>Interviews, journaling, observation</h4>
        ${paras(P.otherResearch, 'To fill in: notes from interviews, journal entries, and things I observed.')}
        <h4>By source <span class="legend-mk">${mark(1, 'Learned')} learned ${mark(1, 'Surprise')} surprise ${mark(1, 'Quote')} quote</span></h4>
        ${DATA.hunches.map(h => `
          <details class="src-group" style="--tint:${h.tint}">
            <summary><span class="sw" style="background:${h.color}"></span>${esc(h.name)}<span class="cnt">${h.questions.reduce((n, q) => n + q.sources.length, 0)}</span></summary>
            <ul>${h.questions.flatMap(q => q.sources).map(s => `
              <li><a href="#/${s.key}"><span class="st">${esc(s.title)}</span><span class="mks">${mark(!!s.takeaway, 'Learned')}${mark(!!s.surprised, 'Surprise')}${mark(!!s.quote, 'Quote')}</span></a><a class="ext" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" title="Open the ${s.type === 'project' ? 'project' : 'paper'}">↗<span class="sr-only"> open ${esc(s.title)} in a new tab</span></a></li>`).join('')}
            </ul>
          </details>`).join('')}
      </section>

      <section>
        <h3><span class="n">02</span>Reflection + refined diagram</h3>
        <p class="ask">How do my sources relate to each other? Does the inquiry space need refining: an area removed or added, narrowed, or more specific directions?</p>
        <h4>How my sources relate</h4>
        ${paras(P.howSourcesConnect, 'To fill in: the threads that run between my sources.')}
        <h4>Links across hunches</h4>
        <ul class="xl">${DATA.crossLinks.map(l => { const qa = Q(l.a), qb = Q(l.b); return qa && qb ? `
          <li><a href="#/${qa.key}"><span class="sw" style="background:${qa.hunch.color}"></span><em>${esc(qa.text)}</em></a>
            <span class="via">┄ ${esc(l.note)} ┄</span>
            <a href="#/${qb.key}"><span class="sw" style="background:${qb.hunch.color}"></span><em>${esc(qb.text)}</em></a></li>` : ''; }).join('')}</ul>
        <h4>Refined inquiry space</h4>
        ${P.refinedImage ? `<img src="${esc(P.refinedImage)}" alt="Refined inquiry space diagram">` : ''}
        ${paras(P.refinedInquirySpace, 'To fill in: what changed from the Progress Update 1 map, and why.')}
        <div class="pu2-cta">
          <a class="btn" href="#/web">Open the refined web →</a>
          <button class="btn" type="button" data-compare>Compare with the original map</button>
        </div>
      </section>

      <section>
        <h3><span class="n">03</span>NYU experts</h3>
        <p class="ask">Three people at NYU working on areas related to my findings. Ask one for an interview, now or once the concept is more formed.</p>
        <div class="experts">${P.experts.map(x => `
          <div class="expert">
            <b>${esc(x.name)}</b>
            <span>${esc([x.program, x.focus].filter(Boolean).join(' · '))}</span>
            ${x.relatesTo ? `<p>${esc(x.relatesTo)}</p>` : `<p class="todo">To fill in: how their work relates to my findings.</p>`}
            <em class="iv ${x.interview ? 'on' : ''}">Interview: ${esc(x.interview || 'not requested yet')}</em>
          </div>`).join('')}</div>
      </section>`;
  }

  document.addEventListener('click', e => {
    if (e.target.closest('[data-stance]')) { e.preventDefault(); openOverlay(stance); }
    else if (e.target.closest('[data-compare]')) {
      carryMode = true;
      closeOverlays(false);
      if (current && current.key === 'intro') {
        const t = current.el.querySelector('[data-carry]');
        t.setAttribute('aria-pressed', 'true'); current.el.querySelector('.imap').classList.add('carry');
      } else location.hash = '#/';
    }
    else if (e.target.closest('[data-close]') || e.target === scrim) closeOverlays();
  });
  $('pu2Btn').addEventListener('click', () => openOverlay(pu2));
  $('backBtn').addEventListener('click', goUp);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (closeOverlays()) return;
    if (current && current.closePop && current.closePop(true)) return;
    if (!mobile) goUp();
  });

  /* ---------- mobile: stacked list ---------- */
  function buildList() {
    const I = DATA.intro;
    $('list').innerHTML = `
      <h1>${esc(DATA.title)}</h1>
      <p class="sub">${esc(DATA.subtitle)}</p>
      <figure><img src="${esc(I.image)}" alt="${esc(I.imageAlt)}"></figure>
      <p class="blurb"><strong>${esc(I.label)}:</strong> ${esc(I.blurb)}</p>
      <section class="m-thesis">
        <p class="eyebrow">Thesis question</p>
        <h2>${esc(DATA.thesisQuestion)}</h2>
        <details><summary class="chip">My stance</summary><p>${esc(DATA.stance)}</p></details>
      </section>
      ${DATA.hunches.map(h => `
        <section class="m-hunch" id="m-${h.id}" style="--tint:${h.tint}">
          <p class="eyebrow" style="color:${h.ink}">Hunch ${h.n}</p>
          <h3>${esc(h.name)}</h3>
          <p>${esc(h.blurb)}</p>
          ${h.questions.map(q => `
            <details id="m-${h.id}-${q.id}">
              <summary>${esc(q.text)}</summary>
              <ul class="m-src">${q.sources.map(s => `
                <li>
                  <span class="tag"><i class="${s.type === 'project' ? 'lr' : 'ld'}"></i>${s.type === 'project' ? 'Project' : 'Paper'}</span>
                  <p class="t">${esc(s.title)}</p>
                  <p class="m">${esc(s.authors)} · ${esc(s.year)} · ${esc(s.venue)}</p>
                  <p><b>What I learned:</b> ${esc(s.takeaway)}</p>
                  ${s.surprised ? `<p><b>What surprised me:</b> ${esc(s.surprised)}</p>` : ''}
                  ${s.quote ? `<p class="w">“${esc(s.quote)}”</p>` : ''}
                  <p class="w">${esc(s.why)}</p>
                  <a class="go" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Read it →</a>
                </li>`).join('')}</ul>
              ${related(q).map(r => `<a class="m-rel" href="#/${r.q.key}">Related in another hunch → <em>${esc(r.q.hunch.name)}</em></a>`).join('')}
            </details>`).join('')}
        </section>`).join('')}`;
  }
  function renderList(r) {
    let target = null;
    if (r.q) { target = $(`m-${r.h.id}-${r.q.id}`); target.open = true; }
    else if (r.h) target = $(`m-${r.h.id}`);
    if (target) target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }

  /* ---------- boot ---------- */
  const mq = matchMedia('(max-width: 760px)');
  function applyMode() {
    const m = mq.matches;
    if (m === mobile) return;
    mobile = m;
    document.body.classList.toggle('mobile', m);
    if (m) { if (!$('list').childElementCount) buildList(); }
    else { current = null; inner.innerHTML = ''; }
    render();
  }
  $('brandName').textContent = DATA.title;
  $('stanceBody').textContent = DATA.stance;
  buildPU2();
  buildMinimap();
  addEventListener('hashchange', render);
  mq.addEventListener('change', applyMode);
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (!mobile && current) rebuild(); }, 160); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (mobile || !current) return; if (current.key === 'intro') rebuild(); else drawSpokes(current); });
  applyMode();
})();
</script>
</body>
</html>
