<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="640" height="400" fill="#fbf9f4"/>
<ellipse cx="320" cy="215" rx="300" ry="160" fill="#a3c19a" opacity=".26"/>
<rect x="16" y="14" width="236" height="24" rx="12" fill="#fff" stroke="#1f1d1a" stroke-opacity=".18"/><text x="134" y="30" text-anchor="middle" font-size="11" letter-spacing=".8" fill="#6f6a61">CONCEPT SKETCH · NOT MADE YET</text>
<rect x="70" y="58" width="180" height="310" rx="26" fill="#fff" stroke="#1f1d1a" stroke-width="1.6"/>
<rect x="128" y="70" width="64" height="8" rx="4" fill="#1f1d1a" opacity=".15"/>
<text x="160" y="110" text-anchor="middle" font-size="11" fill="#6f6a61">Solve for x</text>
<text x="160" y="138" text-anchor="middle" font-size="20" fill="#1f1d1a">3x + 5 = 20</text>
<rect x="88" y="160" width="144" height="70" rx="12" fill="#eaf1e6" stroke="#1f1d1a" stroke-opacity=".25"/>
<text x="100" y="182" font-size="10" fill="#6f6a61">HINT 1 OF 3</text>
<text x="100" y="200" font-size="12" fill="#1f1d1a">What could you do to</text><text x="100" y="216" font-size="12" fill="#1f1d1a">both sides first?</text>
<rect x="88" y="244" width="144" height="34" rx="17" fill="#1f1d1a"/><text x="160" y="266" text-anchor="middle" font-size="12" fill="#fff">Show next hint</text>
<rect x="88" y="288" width="144" height="34" rx="17" fill="none" stroke="#1f1d1a" stroke-opacity=".3"/><text x="160" y="310" text-anchor="middle" font-size="12" fill="#6f6a61">My answer: x = ___</text>
<text x="160" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1d1a">Screen version (Figma)</text>
<g stroke="#1f1d1a" stroke-width="1.5">
<rect x="330" y="120" width="150" height="200" rx="12" fill="#fff" transform="rotate(-10 405 220)"/>
<rect x="370" y="110" width="150" height="200" rx="12" fill="#fff" transform="rotate(2 445 210)"/>
<rect x="414" y="104" width="150" height="200" rx="12" fill="#eaf1e6" transform="rotate(12 489 204)"/>
</g>
<g transform="rotate(12 489 204)"><text x="430" y="134" font-size="11" fill="#6f6a61">HINT 3</text><text x="430" y="160" font-size="13" fill="#1f1d1a">Now divide.</text><text x="430" y="180" font-size="13" fill="#1f1d1a">What's left?</text></g>
<g transform="rotate(2 445 210)"><text x="386" y="138" font-size="11" fill="#6f6a61">HINT 2</text></g>
<text x="460" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1d1a">Paper version (hint cards)</text>
<text x="460" y="350" text-anchor="middle" font-size="11" fill="#6f6a61">The answer is never shown</text>
</svg>
